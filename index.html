<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Messenger Revival — tributo web a la era clásica de la mensajería instantánea." />
  <title>Messenger Revival</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="desktop-shell">
    <section class="buddy-window glass" aria-label="Lista de contactos">
      <header class="titlebar">
        <div class="brand-dot" aria-hidden="true"></div>
        <strong>Messenger Revival</strong>
        <div class="window-actions" aria-hidden="true">
          <button>—</button><button>□</button><button>×</button>
        </div>
      </header>

      <div class="profile-card">
        <div class="avatar avatar-main" aria-hidden="true">S</div>
        <div class="profile-copy">
          <input id="displayName" class="name-input" value="Spencer" aria-label="Tu apodo" />
          <select id="statusSelect" aria-label="Tu estado">
            <option value="online">Disponible</option>
            <option value="away">Ausente</option>
            <option value="busy">Ocupado</option>
          </select>
        </div>
        <span id="selfStatusDot" class="status-dot online" title="Estado actual"></span>
      </div>

      <div class="toolbar">
        <button id="newChatBtn" class="toolbar-btn">💬 Nuevo chat</button>
        <button id="randomNickBtn" class="toolbar-btn">🎲 Apodo</button>
      </div>

      <div class="search-wrap">
        <input id="contactSearch" type="search" placeholder="Buscar contacto…" aria-label="Buscar contacto" />
      </div>

      <div class="section-label">
        <span>Contactos conectados</span>
        <span id="onlineCounter">0</span>
      </div>

      <ul id="contactList" class="contact-list" aria-label="Contactos"></ul>

      <footer class="buddy-footer">
        <span>🟢 En línea</span>
        <span>Messenger Revival v0.1</span>
      </footer>
    </section>

    <section id="chatWindow" class="chat-window glass" aria-label="Ventana de conversación">
      <header class="titlebar chat-titlebar">
        <div class="contact-heading">
          <span id="chatStatusDot" class="status-dot online"></span>
          <div>
            <strong id="chatTitle">Alex</strong>
            <small id="chatSubtitle">Disponible</small>
          </div>
        </div>
        <div class="window-actions" aria-hidden="true">
          <button>—</button><button>□</button><button>×</button>
        </div>
      </header>

      <div class="conversation-info">
        <div id="chatAvatar" class="avatar avatar-contact">A</div>
        <div>
          <strong id="chatInfoName">Alex</strong>
          <span>está conectado.</span>
        </div>
      </div>

      <div id="messagePane" class="message-pane" aria-live="polite"></div>

      <div class="composer-tools" aria-label="Herramientas de mensaje">
        <button class="emoji-btn" data-emoji="😀">😀</button>
        <button class="emoji-btn" data-emoji="😂">😂</button>
        <button class="emoji-btn" data-emoji="❤️">❤️</button>
        <button class="emoji-btn" data-emoji="😎">😎</button>
        <button class="emoji-btn" data-emoji="👋">👋</button>
        <button id="nudgeBtn" class="nudge-btn" title="Enviar zumbido">⚡ Zumbido</button>
      </div>

      <form id="messageForm" class="composer">
        <textarea id="messageInput" rows="3" maxlength="500" placeholder="Escribe un mensaje…" aria-label="Escribir mensaje"></textarea>
        <button class="send-btn" type="submit">Enviar</button>
      </form>

      <footer class="chat-footer">
        <span>🔒 Demo local — tus mensajes quedan guardados en este navegador.</span>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
